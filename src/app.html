<!DOCTYPE html>
<html lang="en">

<head>
	<meta name="theme-color" content="#F4F4F0" />
	<script>
		(function() {
			var t = localStorage.getItem('theme') || 'system';
			var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
			if (dark) {
				document.documentElement.classList.add('dark');
				document.querySelector('meta[name="theme-color"]').content = '#0A0A0A';
			}
		})();
	</script>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/wk-18k.png" />
	<title>Watchakorn Buddeewong - Software Developer</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="description" content="Watchakorn Buddeewong - Full Stack Software Developer. Python, Go, TypeScript, Flutter. Building scalable systems." />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
